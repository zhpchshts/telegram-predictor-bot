services:
  predictor-bot:
    build: .
    container_name: telegram-predictor-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/predictor.db
      TELEGRAM_MTPROTO_SESSION_PATH: /data/telegram-mtproto
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 20s
