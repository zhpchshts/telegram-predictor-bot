name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js for Mini App syntax check
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run linter
        run: python -m ruff check .

      - name: Check Mini App JavaScript syntax
        run: node --check tma/app.js

      - name: Run tests
        run: python -m pytest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      TMA_TEST_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install browser test dependencies
        run: python -m pip install -r requirements.txt -r requirements-browser.txt

      - name: Install browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run Mini App browser tests
        run: python -m pytest tests/browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.browser }}
          path: tmp/browser-artifacts/
          if-no-files-found: ignore
