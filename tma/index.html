<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Клевер</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="app-header">
        <p class="eyebrow">ФУТБОЛЬНЫЙ КОНКУРС</p>
        <h1>Клевер</h1>
        <p id="chat-summary" class="subtitle">
          Загружаем конкурсы этого чата…
        </p>
      </header>

      <section id="app-content" aria-live="polite">
        <section class="status-card">
          <div class="status-indicator" aria-hidden="true"></div>
          <div>
            <h2>Открываем конкурсы</h2>
            <p id="app-status">Проверяем доступ к конкурсу…</p>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
